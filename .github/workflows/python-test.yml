name: Build Test Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ---------------- CI ----------------
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    outputs:
      dockerhub-configured: ${{ steps.dockerhub.outputs.configured }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest

      - name: Run unit tests
        # --strict-markers keeps typos in markers from silently passing.
        # No "|| true" here on purpose: a failing test must fail the build.
        run: pytest -v --strict-markers

      - name: Build Docker image
        # Local tag only. The test job must not depend on Docker Hub secrets;
        # interpolating an unset secret here produced "/sensor-monitor:latest",
        # which is an invalid image reference.
        run: docker build -t sensor-monitor:ci .

      - name: Check Docker Hub credentials
        id: dockerhub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN are not set - the deploy job will be skipped."
          fi

  # ---------------- CD ----------------
  deploy:
    name: Push to Docker Hub
    needs: build-test
    # Deploy only from main, and only when the Docker Hub secrets exist.
    # Without the secrets check the job would fail instead of skipping.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.build-test.outputs.dockerhub-configured == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sensor-monitor:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/sensor-monitor:${{ github.sha }}
